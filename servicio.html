<style>
/* ── HERO ────────────────────────────────────── */
.svc-hero {
  display: flex;
  align-items: center;
  padding: 40px 8% 50px;
  gap: 60px;
}
.svc-hero-text { flex: 1.2; }

.svc-tagline {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  color: var(--gold);
  font-size: 1.2rem;
  display: block;
  margin-bottom: 10px;
}
.svc-hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 6vw, 5.5rem);
  line-height: 1.1;
  margin-bottom: 25px;
  background: linear-gradient(45deg, var(--navy), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.svc-hero-desc {
  font-size: 1.05rem;
  font-weight: 300;
  color: var(--mid);
  max-width: 550px;
  line-height: 1.8;
  margin-bottom: 40px;
}
.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }

.svc-hero-img-box {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
.svc-main-img {
  width: 100%;
  max-width: 500px;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 4px;
  border: 4px solid var(--white);
  box-shadow: 0 30px 60px rgba(0,0,0,0.10);
}

/* ── PROCESS CARDS ───────────────────────────── */
.process-section {
  padding: 40px 8%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
  background: var(--cream);
}
.process-card {
  background: var(--white);
  padding: 60px 40px;
  border-radius: 2px;
  position: relative;
  border: 1px solid rgba(0,0,0,0.03);
  box-shadow: 0 10px 30px rgba(0,0,0,0.02);
  transition: transform 0.6s cubic-bezier(0.25,0.8,0.25,1),
              box-shadow 0.6s cubic-bezier(0.25,0.8,0.25,1),
              border-color 0.6s cubic-bezier(0.25,0.8,0.25,1);
  overflow: hidden;
}
.process-card::before {
  content: '∞';
  position: absolute;
  font-size: 10rem;
  color: rgba(197,164,103,0.04);
  top: -40px; right: -20px;
  font-family: 'Playfair Display', serif;
  line-height: 1;
  transition: all 0.6s ease;
}
.process-card:hover {
  box-shadow: 0 25px 50px rgba(26,36,54,0.08);
  transform: translateY(-10px);
  border-color: rgba(197,164,103,0.3);
}
.process-card:hover::before {
  transform: scale(1.1) rotate(10deg);
  color: rgba(197,164,103,0.08);
}
.process-card.featured {
  border-top: 5px solid var(--gold);
  transform: translateY(-15px);
}
.process-card.featured:hover { transform: translateY(-22px); }

.card-number {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-style: italic;
  font-size: 1.5rem;
  display: block;
  margin-bottom: 15px;
}
.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  margin-bottom: 20px;
  color: var(--dark);
  line-height: 1.2;
}
.card-text {
  font-size: 0.95rem;
  color: var(--mid);
  line-height: 1.7;
  position: relative;
  z-index: 2;
}

/* ── PRICE SECTION ───────────────────────────── */
.price-section {
  padding: 40px 8% 100px;
  background: var(--cream);
}
.price-header {
  text-align: center;
  margin-bottom: 40px;
}
.price-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 5vw, 3.5rem);
  color: var(--dark);
}
.price-title span { color: var(--gold); font-style: italic; }

.price-table {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  border-collapse: separate;
  border-spacing: 0 20px;
}
.price-row {
  background: var(--white);
  box-shadow: 0 5px 20px rgba(0,0,0,0.02);
  border-radius: 8px;
  transition: all 0.6s cubic-bezier(0.25,0.8,0.25,1);
}
.price-row:hover {
  transform: scale(1.02);
  background: linear-gradient(to right, #FFFFFF, #FCFBF9);
  box-shadow: 0 15px 40px rgba(197,164,103,0.15);
}
.price-row td {
  padding: 35px 40px;
}
.price-row td:first-child {
  border-left: 4px solid var(--gold);
  border-radius: 8px 0 0 8px;
}
.price-row td:last-child {
  border-radius: 0 8px 8px 0;
  text-align: right;
  white-space: nowrap;
}
.service-name {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--dark);
  display: block;
  margin-bottom: 6px;
}
.service-desc { font-size: 0.9rem; color: var(--mid); font-weight: 300; }
.service-price {
  color: var(--gold);
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem;
  font-weight: 700;
}
.dur-badge {
  display: inline-block;
  font-size: 0.68rem;
  background: var(--gold);
  color: var(--white);
  padding: 3px 9px;
  border-radius: 4px;
  margin-left: 10px;
  vertical-align: middle;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.price-ctas {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-top: 40px;
}

/* ── PARALLELOGRAM BUTTON ────────────────────── */
.btn-para {
  background: var(--navy);
  color: var(--white) !important;
  padding: 16px 40px;
  display: inline-block;
  text-decoration: none;
  letter-spacing: 2px;
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
  transition: all 0.6s cubic-bezier(0.25,0.8,0.25,1);
  cursor: pointer;
  border: none;
  font-family: 'Montserrat', sans-serif;
}
.btn-para:hover {
  background: var(--gold);
  color: var(--navy) !important;
  padding: 16px 50px;
  box-shadow: 0 10px 20px rgba(197,164,103,0.3);
}
.btn-para.gold {
  background: var(--gold);
  color: var(--navy) !important;
}
.btn-para.gold:hover {
  background: var(--navy);
  color: var(--white) !important;
}

/* ── PROMO BANNER ───────────────────────────── */
.promo-banner {
  max-width: 680px;
  margin: 0 auto 48px;
  background: linear-gradient(135deg, var(--cream) 0%, var(--gold-pale) 50%, var(--cream) 100%);
  border: 1.5px solid rgba(197,164,103,0.3);
  border-radius: 16px;
  padding: 48px 44px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(197,164,103,0.12);
  text-align: center;
  color: var(--dark);
}
.promo-banner::before {
  content: '';
  position: absolute;
  top: -60%; left: -20%;
  width: 140%;
  height: 140%;
  background: radial-gradient(ellipse at 30% 20%, rgba(197,164,103,0.10) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 80%, rgba(197,164,103,0.06) 0%, transparent 50%);
  pointer-events: none;
}
.promo-banner::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.promo-icon {
  font-size: 2.4rem;
  display: block;
  margin-bottom: 12px;
  position: relative;
  z-index: 1;
}
.promo-label {
  font-size: 0.62rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold-d);
  font-weight: 600;
  display: block;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}
.promo-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
  line-height: 1.2;
}
.promo-subtitle {
  font-size: 0.88rem;
  color: var(--mid);
  font-weight: 300;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
}
.promo-discount {
  display: inline-block;
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--white);
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
  border: none;
  padding: 12px 40px;
  border-radius: 8px;
  position: relative;
  z-index: 1;
  letter-spacing: 0.04em;
  box-shadow: 0 6px 20px rgba(26,36,54,0.2);
}
.promo-sparkle {
  position: absolute;
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.35;
}
.promo-sparkle:nth-child(1) { top: 15%; left: 8%; }
.promo-sparkle:nth-child(2) { top: 25%; right: 12%; opacity: 0.2; width: 4px; height: 4px; }
.promo-sparkle:nth-child(3) { bottom: 20%; left: 15%; opacity: 0.18; width: 5px; height: 5px; }
.promo-sparkle:nth-child(4) { bottom: 30%; right: 8%; opacity: 0.25; }

@media (max-width: 768px) {
  .promo-banner { padding: 36px 28px; margin: 0 16px 40px; }
  .promo-title { font-size: 1.4rem; }
  .promo-discount { font-size: 1.5rem; padding: 8px 24px; }
}

/* ── RELATED SERVICES ────────────────────────── */
.related-sec {
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 80px 8% 100px;
}
.related-header {
  text-align: center;
  margin-bottom: 48px;
}
.related-header .tag-light {
  display: block;
  font-size: 0.68rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
  font-weight: 500;
}
.related-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4vw, 2.8rem);
  color: var(--dark);
}
.related-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
}

/* ── BOOKING MODAL ───────────────────────────── */
.booking-modal {
  display: none;
  position: fixed;
  z-index: 2000;
  inset: 0;
  background: rgba(26,36,54,0.80);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.booking-modal.show { display: flex; opacity: 1; }
.modal-content {
  background: var(--cream);
  width: 90%;
  max-width: 1000px;
  height: 85vh;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 25px 50px rgba(0,0,0,0.30);
  overflow: hidden;
  transform: scale(0.9);
  transition: transform 0.4s cubic-bezier(0.25,0.8,0.25,1);
}
.booking-modal.show .modal-content { transform: scale(1); }
.close-modal {
  position: absolute;
  top: 15px; right: 20px;
  font-size: 2rem;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;
  background: var(--white);
  width: 45px; height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
  color: var(--dark);
  transition: color 0.3s, transform 0.3s;
}
.close-modal:hover { color: var(--gold); transform: rotate(90deg); }
.modal-iframe { width: 100%; height: 100%; border: none; background: #fff; }

/* ── RESPONSIVE ──────────────────────────────── */
@media (max-width: 900px) {
  .svc-hero { flex-direction: column; text-align: center; padding: 32px 20px 20px; gap: 30px; }
  .svc-hero-text { width: 100%; }
  .svc-hero-desc { margin: 0 auto 30px; max-width: 100%; }
  .hero-ctas { justify-content: center; }
  .svc-main-img { max-width: 340px; }
  .process-section { padding: 30px 5%; }
  .process-card.featured { transform: none; }
  .price-section { padding: 30px 5% 80px; }
  .price-row td { display: block; text-align: center !important; padding: 22px 24px; }
  .price-row td:first-child { border-radius: 8px 8px 0 0; border-left: none; border-top: 4px solid var(--gold); padding-bottom: 10px; }
  .price-row td:last-child { border-radius: 0 0 8px 8px; padding-top: 0; }
  .service-name, .service-desc { text-align: center; }
  .service-price { font-size: 1.8rem; }
  .related-grid { grid-template-columns: 1fr; }
  .modal-content { width: 95%; height: 90vh; }
}
@media (max-width: 600px) {
  .svc-hero { padding: 24px 16px 16px; }
  .svc-hero-title { font-size: clamp(2.2rem, 9vw, 3rem); }
  .svc-hero-desc { font-size: 0.95rem; padding: 0 8px; }
  .hero-ctas .btn-para { padding: 14px 24px; font-size: 0.72rem; }
  .process-section { padding: 24px 16px; }
  .price-section { padding: 24px 16px 60px; }
}
</style>
</head>
<body class="pt-nav">

<div id="navContainer"></div>

<!-- HERO -->
<section class="svc-hero" id="svcHero">
  <div class="svc-hero-text reveal" id="heroText">

      <a id="bookCta" href="#" class="btn-para open-modal-btn">RESERVAR AHORA</a>
      <a id="catCta" href="#" class="btn-para gold">← VER CATEGORÍA</a>
    </div>
  </div>
  <div class="svc-hero-img-box reveal" style="transition-delay:0.2s">
    <img class="svc-main-img" id="svcImg" src="" alt="" />
  </div>
</section>

<!-- PROCESS CARDS -->
<section class="process-section" id="processSection"></section>

<!-- PRICE SECTION -->
<section class="price-section">
  <div class="price-header reveal">
    <h2 class="price-title">Inversión en <span>ti</span></h2>
  </div>
  <table class="price-table">
    <tbody id="priceBody"></tbody>
  </table>
  <div id="promoBanner"></div>
  <div class="price-ctas reveal" style="transition-delay:0.2s">
    <a id="bookCta2" href="#" class="btn-para open-modal-btn">RESERVAR MI CITA AHORA</a>
    <a id="giftCta" href="#" class="btn-para gold">🎁 REGALA ESTE SERVICIO</a>
    <a id="catCta2" href="#" class="btn-para gold">VER MÁS SERVICIOS</a>
  </div>
</section>

<!-- RELATED SERVICES -->
<section class="related-sec" id="relatedSec">
  <div class="related-header reveal">
    <span class="tag-light">También podrías querer</span>
    <h2>Servicios Relacionados</h2>
  </div>
  <div class="related-grid" id="relatedGrid"></div>
</section>

<!-- BOOKING MODAL -->
<div id="bookingModal" class="booking-modal">
  <div class="modal-content">
    <span class="close-modal" id="closeModal">&times;</span>
    <iframe id="bookingIframe" class="modal-iframe" src="" title="Reserva tu cita"></iframe>
  </div>
</div>

<!-- FOOTER -->
<div id="footerContainer"></div>
<div id="floatingContainer"></div>

<script src="/supabase-client.js?v=7"></script>
<script src="/data.js?v=5"></script>
<script src="/common.js?v=13"></script>
<script>
document.getElementById('navContainer').innerHTML = renderNavbar('Servicios')
document.getElementById('footerContainer').innerHTML = renderFooter()
document.getElementById('floatingContainer').innerHTML = renderFloating()

;(async () => {
// Load Supabase data before resolving service
await initSupabaseData()

// Lee el ID del path (/servicio/abc) o del query string (?id=abc) como fallback
const pathMatch = location.pathname.match(/\/servicio\/([a-z0-9-]+)/i)
const svcId = pathMatch ? pathMatch[1] : new URLSearchParams(location.search).get('id')
const result = svcId ? getServiceById(svcId) : null

if (!result) {
  location.href = '/servicios.html'
} else {
  const { service: svc, category: cat } = result

  document.title = `${svc.name} — Spa Infinity`

  /* Hero */
  document.getElementById('svcTagline').textContent = svc.tag
  document.getElementById('svcTitle').textContent = svc.name
  document.getElementById('svcDesc').textContent = svc.longDesc
  document.getElementById('svcImg').src = svc.img
  document.getElementById('svcImg').alt = svc.name

  const waLink = `https://wa.me/56986688771?text=Hola,%20quiero%20reservar%20${encodeURIComponent(svc.name)}`
  const bookUrl = svc.link || waLink
  // Links que no admiten iframe → abrir en nueva pestaña
  const noIframe = ['wa.me','api.whatsapp.com','whatsapp.com','instagram.com','facebook.com','m.me']
  const opensExternal = noIframe.some(d => bookUrl.includes(d))
  ;['bookCta', 'bookCta2'].forEach(id => {
    const el = document.getElementById(id)
    el.href = bookUrl
    if (opensExternal) {
      el.target = '_blank'
      el.rel = 'noopener'
    }
  })
  document.getElementById('catCta').href = `/categoria/${cat.id}`
  document.getElementById('catCta2').href = `/categoria/${cat.id}`
  document.getElementById('giftCta').href = `/giftcard.html?svc=${svc.id}`

  /* Process cards — use processSteps[] if available, fallback to includes[], then defaults */
  let steps
  if (svc.processSteps && svc.processSteps.length >= 3) {
    steps = svc.processSteps.slice(0, 3).map((s, i) => ({
      num: `0${i+1}`,
      title: s.title,
      text: s.text || ''
    }))
  } else if (svc.includes && svc.includes.length >= 3) {
    steps = svc.includes.slice(0, 3).map((item, i) => ({
      num: `0${i+1}`,
      title: item,
      text: ''
    }))
  } else {
    steps = [
      { num: '01', title: 'Evaluación Inicial', text: 'Realizamos una evaluación personalizada para entender tus necesidades y diseñar el tratamiento ideal para ti.' },
      { num: '02', title: 'Tratamiento Experto', text: 'Nuestras especialistas aplican las mejores técnicas y productos premium para garantizar resultados óptimos.' },
      { num: '03', title: 'Cuidado y Seguimiento', text: 'Te entregamos recomendaciones personalizadas para mantener los resultados y prolongar el bienestar.' }
    ]
  }

  document.getElementById('processSection').innerHTML = steps.map((s, i) => `
    <div class="process-card${i === 1 ? ' featured' : ''} reveal" style="transition-delay:${0.1 + i * 0.1}s">
      <span class="card-number">${s.num}</span>
      <h3 class="card-title">${s.title}</h3>
      ${s.text ? `<p class="card-text">${s.text}</p>` : ''}
    </div>
  `).join('')

  /* Price row */
  document.getElementById('priceBody').innerHTML = `
    <tr class="price-row reveal">
      <td>
        <span class="service-name">
          ${svc.name}
          <span class="dur-badge">${svc.duration}</span>
          ${svc.hasDiscount && svc.discountLabel ? `<span class="dur-badge" style="background:var(--red)">${svc.discountLabel}</span>` : ''}
        </span>
        <span class="service-desc">${svc.shortDesc}</span>
      </td>
      <td>
        ${svc.hasDiscount && svc.originalPrice ? `<span style="text-decoration:line-through;color:var(--light);font-size:1.1rem;display:block;margin-bottom:4px">${svc.originalPrice}</span>` : ''}
        <span class="service-price">${svc.price}</span>
      </td>
    </tr>
  `

  /* Promo banner — shows when discount has custom text */
  const promo = getActivePromoForService(svc.id)
  if (promo) {
    document.getElementById('promoBanner').innerHTML = `
      <div class="promo-banner reveal active">
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-icon">${promo.icon || '✨'}</span>
        <span class="promo-label">${promo.label || 'Promoción Especial'}</span>
        <div class="promo-title">${promo.title}</div>
        <div class="promo-subtitle">${promo.subtitle || ''}</div>
        <div class="promo-discount">${promo.discount}</div>
      </div>
    `
  } else if (svc.hasDiscount && svc.discountText) {
    const dlabel = svc.discountLabel || ''
    document.getElementById('promoBanner').innerHTML = `
      <div class="promo-banner reveal active">
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-sparkle"></span>
        <span class="promo-icon">✨</span>
        <span class="promo-label">Promoción Especial</span>
        <div class="promo-title">${svc.discountText}</div>
        <div class="promo-subtitle">¡Aprovecha este precio especial por tiempo limitado!</div>
        <div class="promo-discount">${dlabel}</div>
      </div>
    `
  }

  /* Gift Card CTA — show GC price if active, else service price */
  const giftPrice = (svc.gcDiscountEnabled && svc.gcPrice) ? svc.gcPrice : svc.price
  document.getElementById('giftCta').innerHTML = `🎁 REGALA ESTE SERVICIO · ${giftPrice}`

  /* Related services */
  const related = cat.services.filter(s => s.id !== svc.id).slice(0, 3)
  if (!related.length) document.getElementById('relatedSec').style.display = 'none'
  document.getElementById('relatedGrid').innerHTML = related.map((s, i) => `
    <div class="svc-card-new reveal" style="transition-delay:${i * 0.12}s; cursor:pointer"
         onclick="window.location='/servicio/${s.id}'">
      <div class="card-img-box" style="height:220px; margin-bottom:20px">
        <img src="${s.img}" alt="${s.name}" loading="lazy" />
      </div>
      <span class="card-subtitle">${s.tag}</span>
      <h3 class="card-title" style="font-size:1.5rem; margin-bottom:8px">${s.name}</h3>
      <p class="card-desc" style="font-size:0.85rem; margin-bottom:16px">${s.shortDesc}</p>
      <div style="display:flex; gap:20px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border)">
        <div><span style="font-size:0.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--light);display:block">Duración</span>
             <strong style="font-size:0.9rem">${s.duration}</strong></div>
        <div><span style="font-size:0.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--light);display:block">Precio</span>
             <strong style="font-size:0.9rem;color:var(--gold)">${s.price}</strong></div>
      </div>
      <a href="/servicio/${s.id}" class="btn-para" onclick="event.stopPropagation()" style="font-size:0.7rem;padding:12px 32px">VER DETALLES</a>
    </div>
  `).join('')
}

// Init reveal observer after async content loaded
const revealObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active') })
}, { threshold: 0.07, rootMargin: '0px 0px -20px 0px' })
document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el))

})() // end async IIFE

/* Modal logic */
const bookingModal = document.getElementById('bookingModal')
const bookingIframe = document.getElementById('bookingIframe')

// URLs que no se pueden mostrar en iframe (X-Frame-Options: deny)
const NO_IFRAME_DOMAINS = ['wa.me', 'api.whatsapp.com', 'whatsapp.com', 'instagram.com', 'facebook.com', 'm.me']

document.querySelectorAll('.open-modal-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    const href = btn.getAttribute('href')
    if (href && href.startsWith('http')) {
      // Si el link no admite iframe, abrir en nueva pestaña
      const blocksIframe = NO_IFRAME_DOMAINS.some(d => href.includes(d))
      if (blocksIframe) {
        // No prevenir default; dejar que el navegador abra en nueva pestaña (target="_blank")
        if (!btn.target) btn.target = '_blank'
        return
      }
      e.preventDefault()
      bookingIframe.src = href
      bookingModal.classList.add('show')
      document.body.style.overflow = 'hidden'
    }
  })
})

const hideModal = () => {
  bookingModal.classList.remove('show')
  document.body.style.overflow = 'auto'
  setTimeout(() => { bookingIframe.src = '' }, 300)
}
document.getElementById('closeModal').addEventListener('click', hideModal)
bookingModal.addEventListener('click', e => { if (e.target === bookingModal) hideModal() })

initShared()
</script>
</body>
</html>
