<style>
/* ═══════════════════════════════════════════
   PROMO PAGE — Dynamic Event (from Supabase)
   ═══════════════════════════════════════════ */
.promo-side {
  position: fixed; left: 0; top: 0; bottom: 0; width: 5px; z-index: 9999;
  background: linear-gradient(180deg, #C5A467 0%, #E8C882 40%, #C27B8A 70%, #C5A467 100%);
}
.promo-hero {
  position: relative; min-height: 92vh;
  display: flex; align-items: center; justify-content: center;
  padding: 120px 6% 80px; overflow: hidden; gap: 60px;
  background: linear-gradient(160deg, rgba(253,244,238,0.85) 0%, rgba(250,232,223,0.7) 40%, rgba(253,240,243,0.5) 100%);
}
.promo-hero::before {
  content: '∞'; position: absolute; right: -60px; top: 50%; transform: translateY(-50%);
  font-size: 28rem; font-family: 'Playfair Display', serif; color: rgba(194,123,138,0.05); pointer-events: none;
}
.promo-hero-content { flex: 1; max-width: 640px; position: relative; z-index: 2; }
.promo-badge {
  display: inline-block; font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 16px;
  background: rgba(197,164,103,0.08); padding: 8px 20px; border-radius: 30px;
}
.promo-hero-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.15rem; color: #6B5B4F; margin-bottom: 10px; }
.promo-hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2.8rem, 6vw, 4.8rem); color: #8B6070; line-height: 1.08; margin-bottom: 18px; }
.promo-hero-title .heart { color: #C27B8A; }
.promo-hero-tagline { font-family: 'Playfair Display', serif; font-style: italic; color: #7A6A5E; font-size: 0.95rem; margin-bottom: 14px; }
.promo-hero-desc { color: #6B5B4F; font-size: 0.9rem; line-height: 1.7; margin-bottom: 30px; max-width: 460px; }
.promo-hero-right { flex: 0 0 auto; position: relative; z-index: 2; }
.promo-hero-img { width: 460px; height: 460px; border-radius: 50% 50% 50% 10%; object-fit: cover; box-shadow: 0 30px 80px rgba(194,123,138,0.18); }
.promo-price-badge {
  position: absolute; bottom: -10px; right: -10px; width: 125px; height: 125px;
  background: linear-gradient(135deg, #1A2436 0%, #2A3446 100%); border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
  box-shadow: 0 12px 40px rgba(26,36,54,0.35);
}
.promo-price-badge .from { font-size: 0.5rem; letter-spacing: 2px; opacity: 0.7; text-transform: uppercase; }
.promo-price-badge .amount { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 700; margin: 2px 0; }
.promo-price-badge .label { font-size: 0.48rem; letter-spacing: 1.5px; opacity: 0.7; text-transform: uppercase; }
.promo-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
.btn-promo {
  display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border-radius: 50px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  text-decoration: none; transition: all 0.3s ease; border: none; cursor: pointer;
}
.btn-promo-gold { background: linear-gradient(135deg, #C5A467, #A8883F); color: #fff; }
.btn-promo-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(197,164,103,0.4); }
.btn-promo-wa { background: #25D366; color: #fff; }
.btn-promo-wa:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,211,102,0.35); }
.btn-promo-wa svg { width: 18px; height: 18px; fill: currentColor; }
.promo-info {
  padding: 56px 7%; background: var(--white);
  border-top: 1px solid rgba(197,164,103,0.12); border-bottom: 1px solid rgba(197,164,103,0.12);
}
.promo-info-title { text-align: center; font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 32px; }
.promo-info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; }
.promo-info-card { display: flex; align-items: flex-start; gap: 14px; padding: 20px; border-radius: 10px; background: var(--cream); }
.promo-info-icon { width: 38px; height: 38px; background: rgba(197,164,103,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
.promo-info-text { font-size: 0.8rem; color: #6B5B4F; line-height: 1.5; }
.promo-packs { padding: 80px 7%; background: linear-gradient(180deg, var(--cream) 0%, #FAF5EF 100%); }
.promo-section-header { text-align: center; margin-bottom: 48px; }
.promo-section-eyebrow { font-family: 'Playfair Display', serif; font-style: italic; color: #C27B8A; font-size: 1rem; margin-bottom: 6px; }
.promo-section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 2.7rem); color: var(--dark); }
.promo-section-title em { font-style: italic; color: var(--gold); }
.promo-heart-divider { display: block; text-align: center; font-size: 1.1rem; color: #C27B8A; margin-top: 10px; }
.promo-packs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; max-width: 1200px; margin: 0 auto; }
.promo-packs-row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px; max-width: 800px; margin: 26px auto 0; }
.pack-card {
  background: var(--white); border-radius: 14px; overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.05); transition: transform 0.4s ease, box-shadow 0.4s ease;
  display: flex; flex-direction: column;
}
.pack-card:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(0,0,0,0.1); }
.pack-card.featured { border: 2px solid var(--gold); }
.pack-banner {
  position: relative; padding: 36px 24px 28px; background-size: cover; background-position: center;
  min-height: 190px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
}
.pack-banner::before { content: ''; position: absolute; inset: 0; z-index: 1; }
.pack-banner > * { position: relative; z-index: 2; }
.pack-banner-ornament { font-size: 0.52rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 6px; }
.pack-banner-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.9rem; color: #fff; line-height: 1.1; }
.pack-banner-sub { font-size: 0.55rem; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-top: 5px; }
.pack-banner-deco { position: absolute; right: -20px; top: -20px; font-size: 9rem; font-family: 'Playfair Display', serif; color: rgba(255,255,255,0.05); pointer-events: none; z-index: 1; }
.pack-body { padding: 24px 24px 28px; flex: 1; display: flex; flex-direction: column; }
.pack-name { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--dark); margin-bottom: 4px; }
.pack-subtitle { font-size: 0.78rem; color: #8B7D6B; margin-bottom: 14px; font-style: italic; }
.pack-for { font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; color: #C27B8A; font-weight: 600; margin-bottom: 5px; }
.pack-variants { font-size: 0.8rem; color: #6B5B4F; margin-bottom: 14px; }
.pack-includes { list-style: none; padding: 0; margin: 0 0 auto; }
.pack-includes li { padding: 6px 0; font-size: 0.82rem; color: #4A4A4A; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(0,0,0,0.04); }
.pack-includes li:last-child { border-bottom: none; }
.pack-includes li::before { content: '✓'; color: #C27B8A; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
.pack-footer { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 20px; margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.06); }
.pack-price { font-family: 'Playfair Display', serif; font-size: 1.55rem; color: #8B6070; font-weight: 700; text-align: center; }
.pack-cta {
  display: inline-flex; align-items: center; gap: 7px; padding: 12px 28px; border-radius: 50px;
  background: linear-gradient(135deg, #C5A467, #A8883F); color: #fff; text-decoration: none;
  font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  transition: all 0.3s ease; width: 100%; justify-content: center;
}
.pack-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(197,164,103,0.4); }
.pack-cta svg { width: 14px; height: 14px; fill: currentColor; }
.promo-bottom-cta {
  padding: 70px 7%; background: linear-gradient(135deg, #1A2436 0%, #2A3850 100%);
  text-align: center; position: relative; overflow: hidden;
}
.promo-bottom-cta::after {
  content: '∞'; position: absolute; right: 5%; top: 50%; transform: translateY(-50%);
  font-size: 14rem; font-family: 'Playfair Display', serif; color: rgba(255,255,255,0.03); pointer-events: none;
}
.promo-bottom-urgency { font-family: 'Playfair Display', serif; font-style: italic; color: var(--gold); font-size: 1rem; margin-bottom: 10px; }
.promo-bottom-title { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 3.5vw, 2.4rem); color: #fff; margin-bottom: 26px; }
.promo-bottom-title em { font-style: italic; color: var(--gold); }
.promo-bottom-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 2; }
.btn-promo-outline {
  display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border-radius: 50px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  text-decoration: none; border: 2px solid rgba(255,255,255,0.3); color: #fff; transition: all 0.3s ease;
}
.btn-promo-outline:hover { border-color: #fff; background: rgba(255,255,255,0.08); }
.promo-footer-bar {
  display: flex; justify-content: center; align-items: center; gap: 32px;
  padding: 18px 7%; background: var(--white); border-top: 1px solid rgba(197,164,103,0.12); flex-wrap: wrap;
}
.promo-footer-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #6B5B4F; }
.promo-footer-item svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2; }
.promo-footer-item.accent { font-family: 'Playfair Display', serif; font-style: italic; color: #C27B8A; }
/* Loading */
.promo-loading { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.promo-loading .spinner { width: 40px; height: 40px; border: 3px solid var(--gold-pale,#F5EDE2); border-top-color: var(--gold,#C5A467); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.promo-inactive { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 40px; }
.promo-inactive h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--dark,#1A2436); }
.promo-inactive p { color: #6B5B4F; font-size: 0.95rem; }
/* Responsive */
@media (max-width: 960px) {
  .promo-hero { flex-direction: column; text-align: center; min-height: auto; padding: 100px 5% 50px; }
  .promo-hero-right { margin-top: 30px; }
  .promo-hero-img { width: 280px; height: 280px; }
  .promo-hero-desc { margin: 0 auto 30px; }
  .promo-ctas { justify-content: center; }
  .promo-packs-grid { grid-template-columns: 1fr; max-width: 420px; }
  .promo-packs-row2 { grid-template-columns: 1fr; max-width: 420px; }
  .promo-info-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .promo-hero-img { width: 220px; height: 220px; }
  .promo-price-badge { width: 100px; height: 100px; }
  .promo-price-badge .amount { font-size: 1.15rem; }
  .promo-info-grid { grid-template-columns: 1fr; }
  .promo-footer-bar { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>

<div class="promo-side"></div>
<div id="navContainer"></div>

    <div class="spinner"></div>
    <p style="color:#8B7D6B;font-size:0.85rem">Cargando evento...</p>
  </div>
</div>
<div id="floatingContainer"></div>

<script src="/config-cliente.js?v=1"></script>

<script src="/common.js?v=16"></script>
<script>
document.getElementById('navContainer').innerHTML = renderNavbar('Promocion')
document.getElementById('floatingContainer').innerHTML = renderFloating()

const WA_SVG = '<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>'
const WA_NUM = '56986688771'

function waLink(msg) {
  return `https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

function renderPackCard(pack) {
  const colors = (pack.bannerOverlay || 'rgba(26,36,54,0.78),rgba(15,23,32,0.74)').split(',')
  const overlay = `linear-gradient(160deg,${colors[0]} 0%,${colors[1] || colors[0]} 100%)`
  return `
  <div class="pack-card${pack.featured ? ' featured' : ''}">
    <div class="pack-banner" style="background-image:url('${esc(pack.bannerImage)}')">
      <div class="pack-banner-deco">${esc(pack.deco || '∞')}</div>
      <div style="position:absolute;inset:0;background:${overlay};z-index:1"></div>
      <span class="pack-banner-ornament">${esc(pack.bannerOrnament || '')}</span>
      <h3 class="pack-banner-title">${esc(pack.bannerTitle || pack.name)}</h3>
      <span class="pack-banner-sub">${esc(pack.bannerSub || '')}</span>
    </div>
    <div class="pack-body">
      <h3 class="pack-name">${esc(pack.name)}</h3>
      <p class="pack-subtitle">${esc(pack.subtitle || '')}</p>
      ${pack.forLabel ? `<span class="pack-for">${esc(pack.forLabel)}</span>` : ''}
      ${pack.variants ? `<p class="pack-variants">${esc(pack.variants)}</p>` : ''}
      <ul class="pack-includes">
        ${(pack.services || []).map(s => `<li>${esc(s)}</li>`).join('')}
      </ul>
      <div class="pack-footer">
        <span class="pack-price">${esc(pack.price)}</span>
        <a href="${waLink(pack.whatsappMsg || 'Hola! Quiero reservar')}" target="_blank" class="pack-cta">
          ${WA_SVG} RESERVAR
        </a>
      </div>
    </div>
  </div>`
}

async function loadPromoPage() {
  try {
    const evt = await loadActivePromoEvent()
    if (!evt || !evt.active) {
      document.getElementById('promoContent').innerHTML = `
        <div class="promo-inactive">
          <h2>No hay eventos activos</h2>
          <p>Actualmente no tenemos promociones especiales. ¡Vuelve pronto!</p>
          <a href="/index.html" class="btn-promo btn-promo-gold" style="margin-top:16px">VOLVER AL INICIO</a>
        </div>`
      return
    }

    const c = evt.config
    const packs = c.packs || []
    const row1 = packs.slice(0, 3)
    const row2 = packs.slice(3)
    const waGeneral = waLink(c.whatsappMsg || `Hola! Quiero reservar para el ${c.eventName || 'evento especial'}`)

    document.title = `${c.eventName || 'Evento Especial'} — Spa Infinity | Centro Podológico & Spa`

    // URL limpia según el título del evento (ej: /promocion/mes-renovacion-total)
    if (typeof promoPageUrl === 'function') {
      const cleanUrl = promoPageUrl(c)
      if (location.pathname !== cleanUrl) history.replaceState(null, '', cleanUrl)
      const canon = document.querySelector('link[rel="canonical"]')
      if (canon) canon.href = 'https://spainfinity.cl' + cleanUrl
    }

    document.getElementById('promoContent').innerHTML = `
    <!-- HERO -->
    <section class="promo-hero">
      <div class="promo-hero-content">
        <span class="promo-badge">${esc(c.heroBadge || 'EVENTO ESPECIAL')}</span>
        <p class="promo-hero-sub">${esc(c.heroSubtitle || '')}</p>
        <h1 class="promo-hero-title">${esc(c.heroTitle || c.eventName || 'Evento Especial')} <span class="heart">&#10084;</span></h1>
        <p class="promo-hero-tagline">${esc(c.heroTagline || '')}</p>
        <p class="promo-hero-desc">${esc(c.heroDescription || '')}</p>
        <div class="promo-ctas">
          <a href="#packs" class="btn-promo btn-promo-gold">VER PACKS</a>
          <a href="${waGeneral}" target="_blank" class="btn-promo btn-promo-wa">
            ${WA_SVG} RESERVAR POR WHATSAPP
          </a>
        </div>
      </div>
      <div class="promo-hero-right">
        <img src="${esc(c.heroImage || '')}" alt="${esc(c.eventName || '')}" class="promo-hero-img" loading="eager" />
        <div class="promo-price-badge">
          <span class="from">PACKS DESDE</span>
          <span class="amount">${esc(c.minPrice || '')}</span>
          <span class="label">PRECIO ESPECIAL</span>
        </div>
      </div>
    </section>

    <!-- INFO -->
    <section class="promo-info">
      <h2 class="promo-info-title">&#9733; INFORMACION IMPORTANTE &#9733;</h2>
      <div class="promo-info-grid">
        <div class="promo-info-card">
          <div class="promo-info-icon">&#128340;</div>
          <p class="promo-info-text">Atencion personalizada con hora agendada. Reserva tu cita con anticipacion.</p>
        </div>
        <div class="promo-info-card">
          <div class="promo-info-icon">&#11088;</div>
          <p class="promo-info-text">Productos de alta calidad y tecnologia avanzada para los mejores resultados.</p>
        </div>
        <div class="promo-info-card">
          <div class="promo-info-icon">&#127968;</div>
          <p class="promo-info-text">Ambiente comodo, seguro y relajante disenado para tu bienestar total.</p>
        </div>
        <div class="promo-info-card">
          <div class="promo-info-icon">&#128100;</div>
          <p class="promo-info-text">Profesionales certificados a tu servicio. Tu bienestar es nuestra prioridad.</p>
        </div>
      </div>
    </section>

    <!-- PACKS -->
    <section class="promo-packs" id="packs">
      <div class="promo-section-header">
        <p class="promo-section-eyebrow">Creados con amor</p>
        <h2 class="promo-section-title">Packs <em>Especiales</em></h2>
        <span class="promo-heart-divider">&#10084;</span>
      </div>
      ${row1.length ? `<div class="promo-packs-grid">${row1.map(p => renderPackCard(p)).join('')}</div>` : ''}
      ${row2.length ? `<div class="promo-packs-row2">${row2.map(p => renderPackCard(p)).join('')}</div>` : ''}
    </section>

    <!-- BOTTOM CTA -->
    <section class="promo-bottom-cta">
      <p class="promo-bottom-urgency">${esc(c.bottomUrgency || 'Cupos limitados!')}</p>

        <a href="${waGeneral}" target="_blank" class="btn-promo btn-promo-wa">
          ${WA_SVG} RESERVAR POR WHATSAPP

        <a href="/servicios.html" class="btn-promo-outline">VER TODOS LOS SERVICIOS</a>

    <!-- FOOTER BAR -->
    <div class="promo-footer-bar">
      <span class="promo-footer-item">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
        +56 9 8668 8771
      </span>
      <span class="promo-footer-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        spainfinity.cl
      </span>
      <span class="promo-footer-item">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Santo Domingo 1083, of 502, Santiago

    // Smooth scroll
    document.querySelectorAll('a[href="#packs"]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault()
        document.getElementById('packs').scrollIntoView({ behavior: 'smooth', block: 'start' })
      })
    })
  } catch (err) {
    console.error('Error loading promo:', err)
    document.getElementById('promoContent').innerHTML = `
      <div class="promo-inactive">
        <h2>Error al cargar</h2>
        <p>No pudimos cargar el evento. Intenta recargar la pagina.</p>
        <a href="/index.html" class="btn-promo btn-promo-gold" style="margin-top:16px">VOLVER AL INICIO</a>
      </div>`
  }
}

loadPromoPage()
initShared()
</script>
